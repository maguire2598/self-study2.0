<meta charset="utf-8">
<div id="collisionPiQuestionEditor">
  <h2 id="questionEditorTitle">碰撞与π · A板块题库筛选</h2>
  <p class="text-muted" id="questionSummary"></p>

  <div class="viz-controls" aria-label="题库筛选控件">
    <label class="form-label">板块
      <select class="form-select" id="questionSectionFilter">
        <option value="A">A 板块</option>
        <option value="B">B 板块</option>
      </select>
    </label>
    <label class="form-label">知识点
      <select class="form-select" id="questionNodeSelect"></select>
    </label>
    <label class="form-label">题型
      <select class="form-select" id="questionTypeFilter">
        <option value="all">全部题型</option>
        <option value="single_choice">单选题</option>
        <option value="multiple_choice">多选题</option>
        <option value="multi_blank">多空填空题</option>
      </select>
    </label>
    <label class="form-label">场景题组
      <select class="form-select" id="questionScenarioFilter">
        <option value="all">全部场景</option>
        <option value="standalone">独立短题</option>
      </select>
    </label>
    <label class="form-label">搜索题干
      <input class="form-control" id="questionSearch" type="search" placeholder="输入关键词">
    </label>
  </div>

  <div class="viz-row">
    <button class="btn btn-ghost" id="previousNode" type="button">上一个知识点</button>
    <button class="btn btn-ghost" id="nextNode" type="button">下一个知识点</button>
    <label class="form-check">
      <input class="form-check-input" id="nodeEnabled" type="checkbox">
      <span class="form-check-label">启用当前知识点全部题目</span>
    </label>
  </div>

  <div id="questionList" aria-live="polite"></div>

  <div class="viz-controls" aria-label="题库操作">
    <button class="btn" id="saveDraft" type="button">保存本地草稿</button>
    <button class="btn btn-ghost" id="resetQuestion" type="button">恢复当前知识点原题</button>
    <button class="btn" id="copyQuestionBank" type="button">复制完整题库</button>
    <button class="btn btn-primary" id="submitEdits" type="button">提交本次修改</button>
  </div>
  <p class="text-small text-muted" id="questionEditorStatus" role="status"></p>

  <script id="embeddedQuestionBanks" type="application/json">__QUESTION_BANKS_JSON__</script>
</div>

<style>
  #collisionPiQuestionEditor { display:grid; gap:16px; color:var(--foreground); }
  #collisionPiQuestionEditor #questionList { display:grid; gap:12px; }
  #collisionPiQuestionEditor .cqe-card { display:grid; gap:10px; }
  #collisionPiQuestionEditor .cqe-heading { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  #collisionPiQuestionEditor .cqe-options { display:grid; gap:8px; }
  #collisionPiQuestionEditor .cqe-option { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center; }
  #collisionPiQuestionEditor .cqe-fields { display:grid; gap:8px; }
  #collisionPiQuestionEditor .cqe-card, #collisionPiQuestionEditor .cqe-card p, #collisionPiQuestionEditor .cqe-heading strong { min-width:0; overflow-wrap:anywhere; }
  @media (max-width:520px) { #collisionPiQuestionEditor .cqe-option { grid-template-columns:1fr; } }
</style>

<script>
(() => {
  const root = document.getElementById('collisionPiQuestionEditor');
  const banks = JSON.parse(root.querySelector('#embeddedQuestionBanks').textContent);
  const clone = value => JSON.parse(JSON.stringify(value));
  const legacyDraftKey = 'collision-pi-a-question-draft';
  const query = new URLSearchParams(location.search);
  const requestedSection = query.get("section");
  let sectionId = Object.hasOwn(banks, requestedSection) ? requestedSection : 'A';
  let bank;
  let originalById;
  let nodes = [];
  const nodeSelect = root.querySelector('#questionNodeSelect');
  const sectionFilter = root.querySelector('#questionSectionFilter');
  const typeFilter = root.querySelector('#questionTypeFilter');
  const scenarioFilter = root.querySelector('#questionScenarioFilter');
  const searchInput = root.querySelector('#questionSearch');
  const list = root.querySelector('#questionList');
  const status = root.querySelector('#questionEditorStatus');
  const summary = root.querySelector('#questionSummary');
  const nodeEnabled = root.querySelector('#nodeEnabled');
  const previousNode = root.querySelector('#previousNode');
  const nextNode = root.querySelector('#nextNode');
  const resetQuestion = root.querySelector('#resetQuestion');
  const title = root.querySelector('#questionEditorTitle');

  const typeNames = {
    single_choice: '单选题',
    multiple_choice: '多选题',
    multi_blank: '多空填空题'
  };

  function setStatus(message) {
    status.textContent = message;
  }

  function draftKey(sectionId) {
    return `collision-pi-question-editor:${sectionId}:draft-v1`;
  }

  function parseStoredDraft(rawDraft) {
    try {
      return rawDraft === null ? null : JSON.parse(rawDraft);
    } catch {
      return null;
    }
  }

  function isMatchingBank(candidate, original) {
    return candidate?.course_id === original.course_id &&
      candidate?.section_id === original.section_id &&
      candidate?.version === original.version &&
      Array.isArray(candidate?.questions) &&
      candidate.questions.length === original.questions.length &&
      candidate.questions.every((question, index) => question?.id === original.questions[index]?.id) &&
      Object.keys(original.question_count_by_node).every(nodeId =>
        candidate?.question_count_by_node?.[nodeId] === original.question_count_by_node[nodeId]
      );
  }

  function loadDraft(sectionId) {
    const original = banks[sectionId];
    const qualifiedRaw = localStorage.getItem(draftKey(sectionId));
    const saved = parseStoredDraft(qualifiedRaw);
    if (isMatchingBank(saved, original)) return saved;
    if (sectionId === 'A' && qualifiedRaw === null) {
      const legacy = parseStoredDraft(localStorage.getItem(legacyDraftKey));
      if (isMatchingBank(legacy, original)) {
        localStorage.setItem(draftKey(sectionId), JSON.stringify(legacy));
        return legacy;
      }
    }
    return clone(original);
  }

  function currentBank() {
    return bank;
  }

  function currentNodeEntries() {
    const active = currentBank();
    return Object.keys(active.question_count_by_node).map(nodeId => {
      const question = active.questions.find(item => item.node_id === nodeId);
      return [nodeId, question?.node_title || nodeId];
    });
  }

  function currentScenarios() {
    return [...new Set(currentBank().questions.map(question => question.scenario_id).filter(Boolean))];
  }

  function rebuildDependentFilters() {
    const requestedNode = query.get('node') || query.get('node_id');
    nodes = currentNodeEntries();
    nodeSelect.replaceChildren(new Option('全部知识点', 'all'), ...nodes.map(([nodeId, nodeTitle]) => {
      const option = document.createElement('option');
      option.value = nodeId;
      option.textContent = `${nodeId} · ${nodeTitle}`;
      return option;
    }));
    nodeSelect.value = nodes.some(([nodeId]) => nodeId === requestedNode) ? requestedNode : nodes[0]?.[0] || '';
    scenarioFilter.replaceChildren(
      new Option('全部场景', 'all'),
      new Option('独立短题', 'standalone'),
      ...currentScenarios().map(scenarioId => new Option(scenarioId, scenarioId))
    );
    typeFilter.value = 'all';
    scenarioFilter.value = 'all';
    searchInput.value = '';
  }

  function activateSection(nextSection) {
    if (bank) localStorage.setItem(draftKey(sectionId), JSON.stringify(currentBank()));
    sectionId = nextSection;
    bank = loadDraft(sectionId);
    originalById = new Map(banks[sectionId].questions.map(question => [question.id, question]));
    sectionFilter.value = sectionId;
    title.textContent = `碰撞与π · ${sectionId}板块题库筛选`;
    rebuildDependentFilters();
  }

  function markChanged(question) {
    question.revision = (question.revision || 0) + 1;
    updateSummary();
  }

  function changedQuestions() {
    return currentBank().questions.filter(question => JSON.stringify(question) !== JSON.stringify(originalById.get(question.id)));
  }

  function updateSummary() {
    const active = currentBank();
    const enabled = active.questions.filter(question => question.enabled).length;
    summary.textContent = `${nodes.length} 个知识点 · ${active.questions.length} 道题 · 已启用 ${enabled} 道 · 已修改 ${changedQuestions().length} 道`;
  }

  function makeTextField(labelText, value, onInput, rows = 2) {
    const label = document.createElement('label');
    label.className = 'form-label';
    label.append(document.createTextNode(labelText));
    const control = document.createElement(rows > 1 ? 'textarea' : 'input');
    control.className = 'form-control';
    if (rows > 1) control.rows = rows;
    control.value = value;
    control.addEventListener('input', () => onInput(control.value));
    label.append(control);
    return label;
  }

  function renderQuestion(question) {
    const card = document.createElement('article');
    card.className = 'card cqe-card';
    card.dataset.questionId = question.id;

    const heading = document.createElement('div');
    heading.className = 'cqe-heading';
    const title = document.createElement('strong');
    title.textContent = `${question.id} · ${typeNames[question.question_type]}`;
    const enabledLabel = document.createElement('label');
    enabledLabel.className = 'form-check';
    const enabledInput = document.createElement('input');
    enabledInput.className = 'form-check-input';
    enabledInput.type = 'checkbox';
    enabledInput.checked = question.enabled;
    enabledInput.addEventListener('change', () => {
      question.enabled = enabledInput.checked;
      markChanged(question);
      updateNodeEnabled();
    });
    const enabledText = document.createElement('span');
    enabledText.className = 'form-check-label';
    enabledText.textContent = '纳入题库';
    enabledLabel.append(enabledInput, enabledText);
    heading.append(title, enabledLabel);
    card.append(heading);

    const metadata = document.createElement('p');
    metadata.className = 'text-small text-muted';
    metadata.textContent = [
      question.question_style,
      question.scenario_id || 'standalone',
      question.event_stage
    ].join(' · ');
    card.append(metadata);

    card.append(makeTextField('题干', question.prompt, value => {
      question.prompt = value;
      markChanged(question);
    }, 3));

    if (question.options) {
      const options = document.createElement('div');
      options.className = 'cqe-options';
      question.options.forEach(option => {
        const row = document.createElement('label');
        row.className = 'cqe-option';
        const answer = document.createElement('input');
        answer.type = question.question_type === 'single_choice' ? 'radio' : 'checkbox';
        answer.name = `answer-${question.id}`;
        answer.checked = question.correct_answers.includes(option.id);
        answer.setAttribute('aria-label', `${option.id}为正确答案`);
        answer.addEventListener('change', () => {
          if (question.question_type === 'single_choice') {
            question.correct_answers = [option.id];
          } else if (answer.checked) {
            question.correct_answers = [...new Set([...question.correct_answers, option.id])];
          } else {
            question.correct_answers = question.correct_answers.filter(id => id !== option.id);
          }
          markChanged(question);
        });
        const text = document.createElement('input');
        text.className = 'form-control';
        text.value = option.text;
        text.setAttribute('aria-label', `选项${option.id}`);
        text.addEventListener('input', () => {
          option.text = text.value;
          markChanged(question);
        });
        row.append(answer, text);
        options.append(row);
      });
      card.append(options);
    } else {
      const fields = document.createElement('div');
      fields.className = 'cqe-fields';
      question.blanks.forEach((blank, index) => {
        fields.append(makeTextField(`第 ${index + 1} 空可接受答案（用 | 分隔）`, blank.accepted_answers.join(' | '), value => {
          blank.accepted_answers = value.split('|').map(item => item.trim()).filter(Boolean);
          markChanged(question);
        }, 1));
      });
      card.append(fields);
    }

    card.append(makeTextField('答案解析（仅作者端编辑）', question.explanation, value => {
      question.explanation = value;
      markChanged(question);
    }, 2));
    card.append(makeTextField('作者备注', question.author_notes || '', value => {
      question.author_notes = value;
      markChanged(question);
    }, 2));
    return card;
  }

  function currentNodeId() {
    return nodeSelect.value || nodes[0][0];
  }

  function updateNodeEnabled() {
    const allNodes = currentNodeId() === 'all';
    nodeEnabled.disabled = allNodes;
    resetQuestion.disabled = allNodes;
    if (allNodes) {
      nodeEnabled.checked = false;
      nodeEnabled.indeterminate = false;
      return;
    }
    const nodeQuestions = currentBank().questions.filter(question => question.node_id === currentNodeId());
    nodeEnabled.checked = nodeQuestions.every(question => question.enabled);
    nodeEnabled.indeterminate = !nodeEnabled.checked && nodeQuestions.some(question => question.enabled);
  }

  function matchesScenario(question) {
    if (scenarioFilter.value === 'all') return true;
    if (scenarioFilter.value === 'standalone') return !question.scenario_id;
    return question.scenario_id === scenarioFilter.value;
  }

  function render() {
    const query = searchInput.value.trim().toLowerCase();
    const selectedType = typeFilter.value;
    const questions = currentBank().questions.filter(question =>
      (currentNodeId() === 'all' || question.node_id === currentNodeId()) &&
      (selectedType === 'all' || question.question_type === selectedType) &&
      matchesScenario(question) &&
      (!query || `${question.prompt} ${question.options?.map(option => option.text).join(' ') || ''}`.toLowerCase().includes(query))
    );
    list.replaceChildren(...questions.map(renderQuestion));
    if (!questions.length) {
      const empty = document.createElement('p');
      empty.className = 'text-muted';
      empty.textContent = '当前筛选条件下没有题目。';
      list.append(empty);
    }
    updateNodeEnabled();
    updateSummary();
  }

  function moveNode(step) {
    if (currentNodeId() === 'all') {
      nodeSelect.value = step > 0 ? nodes[0][0] : nodes[nodes.length - 1][0];
      render();
      return;
    }
    const currentIndex = nodes.findIndex(([nodeId]) => nodeId === currentNodeId());
    const nextIndex = (currentIndex + step + nodes.length) % nodes.length;
    nodeSelect.value = nodes[nextIndex][0];
    render();
  }

  nodeSelect.addEventListener('change', render);
  sectionFilter.addEventListener('change', () => {
    activateSection(sectionFilter.value);
    render();
  });
  typeFilter.addEventListener('change', render);
  scenarioFilter.addEventListener('change', render);
  searchInput.addEventListener('input', render);
  previousNode.addEventListener('click', () => moveNode(-1));
  nextNode.addEventListener('click', () => moveNode(1));
  nodeEnabled.addEventListener('change', () => {
    if (currentNodeId() === 'all') return;
    currentBank().questions.filter(question => question.node_id === currentNodeId()).forEach(question => {
      question.enabled = nodeEnabled.checked;
      markChanged(question);
    });
    render();
  });

  root.querySelector('#saveDraft').addEventListener('click', () => {
    localStorage.setItem(draftKey(sectionId), JSON.stringify(currentBank()));
    setStatus(`草稿已保存：${new Date().toLocaleTimeString()}`);
  });

  resetQuestion.addEventListener('click', () => {
    if (currentNodeId() === 'all') return;
    const nodeId = currentNodeId();
    currentBank().questions = currentBank().questions.map(question => question.node_id === nodeId ? clone(originalById.get(question.id)) : question);
    localStorage.setItem(draftKey(sectionId), JSON.stringify(currentBank()));
    setStatus(`${nodeId} 已恢复为初始题目。`);
    render();
  });

  root.querySelector('#copyQuestionBank').addEventListener('click', async () => {
    await navigator.clipboard.writeText(JSON.stringify(currentBank(), null, 2));
    setStatus('完整题库 JSON 已复制。');
  });

  root.querySelector('#submitEdits').addEventListener('click', async () => {
    const changes = changedQuestions();
    if (!changes.length) {
      setStatus('当前没有需要提交的修改。');
      return;
    }
    const prompt = `这是我对《碰撞与π》${sectionId}板块题库的修改，共 ${changes.length} 道：\n\n${JSON.stringify(changes, null, 2)}\n\n请校验结构和答案后写回正式题库。`;
    if (window.openai?.sendFollowUpMessage) {
      await window.openai.sendFollowUpMessage({ title: `提交${sectionId}板块题库修改`, prompt });
      setStatus(`已提交 ${changes.length} 道修改。`);
    } else {
      await navigator.clipboard.writeText(prompt);
      setStatus('当前环境不能直接提交，修改内容已复制，请粘贴回对话。');
    }
  });

  activateSection(sectionId);
  render();
})();
</script>
