<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img"><title>墙反射只改变小物块速度符号。</title><desc>墙反射前后大物块加权坐标相同，小物块坐标反号。</desc><defs><marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>
.frame{fill:#fffdf8;stroke:#cbd5e1;stroke-width:1}.axis{stroke:#64748b;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.energy{fill:none;stroke:#0f766e;stroke-width:3}.momentum{fill:none;stroke:#c2410c;stroke-width:2.5}.state{fill:#2563eb;stroke:#fff;stroke-width:1.5}.crossing{fill:#db2777}.state-chain{fill:none;stroke:#2563eb;stroke-width:2.5}.reflection{fill:none;stroke:#7c3aed;stroke-width:2.5}.sector{fill:#bbf7d0;fill-opacity:.65;stroke:#15803d;stroke-width:2}.wedge{fill:#fef3c7;fill-opacity:.65;stroke:#b45309;stroke-width:2}.ray{fill:none;stroke:#db2777;stroke-width:2.5}.arrow{stroke-linecap:round}.angle{fill:none;stroke:#b45309;stroke-width:2}.angle-label{fill:#b45309;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:12px}.label{fill:#1e293b;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:14px}.small-label{fill:#475569;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:12px}.event-block{fill:#eff6ff;stroke:#2563eb;stroke-width:1}.event-wall{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1}
</style><rect x="80" y="45" width="500" height="315" class="frame"/><line x1="80" y1="202.5" x2="580" y2="202.5" class="axis arrow" marker-end="url(#arrow-head)"/><line x1="330" y1="360" x2="330" y2="45" class="axis arrow" marker-end="url(#arrow-head)"/><text x="574" y="194.5" class="small-label" text-anchor="end">x</text><text x="338" y="59" class="small-label">y</text><circle cx="330" cy="202.5" r="136.956522" class="energy"/><line x1="412.173913" y1="312.065217" x2="412.173913" y2="92.934783" class="reflection arrow" marker-end="url(#arrow-head)"/><circle cx="412.173913" cy="312.065217" r="5" class="state"/><circle cx="412.173913" cy="92.934783" r="5" class="state"/><text x="420.173913" y="304.065217" class="small-label">前</text><text x="420.173913" y="84.934783" class="small-label">后</text><text x="330" y="390" class="label" text-anchor="middle">x不变</text></svg>