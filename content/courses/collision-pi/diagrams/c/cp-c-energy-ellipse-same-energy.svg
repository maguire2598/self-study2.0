<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img"><title>同一椭圆上的状态共享总动能。</title><desc>三个不同速度分配的状态位于同一个能量椭圆上。</desc><defs><marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>
